version: '4.0'

services:
  elastic:
    image: elasticsearch:8.19.8
    container_name: elasticsearch
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false

  kibana:
    image: kibana:8.19.8
    container_name: kibana
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:9200

  mysql:
    image: mysql:lts
    container_name: mysql
    ports:
      - 3307:3306
    environment:
      - MYSQL_ROOT_PASSWORD=td082003
      - MYSQL_DATABASE=webstudyonline
      - MYSQL_USER=duong
      - MYSQL_PASSWORD=td082003
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data: